# ExceptionRadar Configuration

# Application
app.name=ExceptionRadar
app.version=1.0.0

# Thread Monitoring
thread.monitor.enabled=true
thread.monitor.poll-interval=1000

# Process Monitoring
process.monitor.enabled=true
process.monitor.health-check-interval=5000

# IPC Communication
ipc.type=tcp
ipc.tcp.port=9999
ipc.tcp.host=localhost

# Event Bus
event.bus.async=true
event.bus.queue-size=1000

# Reporting
reporter.console.enabled=true
reporter.file.enabled=true
reporter.file.path=logs/exceptions.log

# Debug
debug.enabled=true