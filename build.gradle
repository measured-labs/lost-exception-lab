plugins {
    id 'java'
    id 'application'
}

group = 'com.exceptionradar'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // Async/Concurrent utilities
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    // Process handling
    implementation 'org.buildobjects:jproc:2.8.2'

    // JSON for inter-process communication
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

    // Monitoring & Metrics
    implementation 'io.micrometer:micrometer-core:1.12.2'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.assertj:assertj-core:3.25.1'
    testImplementation 'org.mockito:mockito-core:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.exceptionradar.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '-parameters',
            '--enable-preview'
    ]
}

tasks.withType(JavaExec) {
    jvmArgs += '--enable-preview'
}

tasks.withType(Test) {
    jvmArgs += '--enable-preview'
}

// Custom task for running with debug
task debugRun(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.exceptionradar.Main'
    jvmArgs = [
            '-Xdebug',
            '-Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=5005',
            '--enable-preview'
    ]
}

// Wrapper task
wrapper {
    gradleVersion = '8.5'
    distributionType = Wrapper.DistributionType.ALL
}